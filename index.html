<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hana Launcher</title>
<style type="text/css">
  body { background:#FFFFFF; color:#000000; font-family:"Times New Roman", Times, serif; margin:0; }
  a { color:#0000EE; }
  a:visited { color:#551A8B; }
  a:hover { color:#EE0000; }
  .b3d {
    background:#E0E0E0; color:#000000; text-decoration:none;
    border-top:2px solid #FFFFFF; border-left:2px solid #FFFFFF;
    border-bottom:2px solid #808080; border-right:2px solid #808080;
    padding:3px 12px; font-family:"Times New Roman", Times, serif; font-size:14px;
  }
  .b3d:active { border-top:2px solid #808080; border-left:2px solid #808080; border-bottom:2px solid #FFFFFF; border-right:2px solid #FFFFFF; }
  .box { border:2px outset #FFFFFF; background:#E8E8E8; }
  table.rel { border:1px solid #808080; border-collapse:collapse; width:100%; }
  table.rel td, table.rel th { border:1px solid #808080; padding:3px 6px; vertical-align:top; }
  table.rel th { background:#DCDCDC; text-align:left; }
  code, .hash { font-family:"Courier New", Courier, monospace; font-size:12px; }
  .muted { color:#606060; }
  .small { font-size:12px; }
  .green { color:#006600; }
  .r { text-align:right; }
  .c { text-align:center; }
  hr { height:2px; color:#808080; background:#808080; border:0; margin:8px 0; }
  h1 { font-size:22px; margin:0 0 2px 0; }
  marquee { width:100%; margin:8px 0 0 0; }
</style>
</head>
<body>

<div style="padding:14px 16px 10px 16px;">
  <table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="vertical-align:middle;">
      <img src="assets/icon.png" alt="Hana Launcher" width="64" height="64">
    </td>
    <td style="vertical-align:middle; padding-left:12px;">
      <h1>Hana Launcher</h1>
    </td>
    <td style="vertical-align:middle; padding-left:30px;">
      <a class="b3d" href="#" id="btnSetup">UNDUH</a>
      <p class="small muted" id="meta" style="margin:4px 0 0 0;">Memuat...</p>
    </td>
  </tr>
  </table>
  <marquee class="small" id="ticker" hidden></marquee>
</div>

<hr>

<div style="padding:0 16px 12px 16px;">
  <div class="box" style="padding:10px;">
    <h2 style="margin:0 0 8px 0; font-size:18px;">DAFTAR RILIS</h2>
    <div id="list"><p class="small">Memuat...</p></div>
    <div id="showAllBox" class="c" style="padding:8px;" hidden>
      <button class="b3d" id="showAllBtn" type="button">Tampilkan semua versi</button>
    </div>
  </div>
</div>

<hr>

<div style="padding:0 16px 16px 16px;">
  <p class="small muted" style="margin:0;">Hana Launcher &middot; StievenW</p>
</div>

<script>
const INDEX = "releases.json";
const LIMIT = 11;
let DATA = null, shown = LIMIT;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(n){
  if(n==null) return "";
  const u=["B","KB","MB","GB"]; let i=0, v=n;
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return v.toFixed(v>=100?0:1)+" "+u[i];
}
function copyText(t, btn){
  const done=()=>{ btn.value="Tersalin"; setTimeout(()=>btn.value="Salin Hash", 1300); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>{});
  }
}
function dlUrl(r, f){
  if(r.tag) return "https://github.com/stievenw/HanaLauncher-portal/releases/download/"+r.tag+"/"+f.file;
  return "downloads/"+r.version+"/"+f.file;
}

async function load(){
  let idx;
  try{ idx = await (await fetch(INDEX, {cache:"no-store"})).json(); }
  catch(e){ document.getElementById("meta").textContent="Gagal memuat daftar rilis."; return; }
  const t = document.getElementById("ticker");
  if(idx.ticker){ t.textContent = idx.ticker; t.hidden = false; }
  DATA = [];
  for(const v of idx.versions){
    try{
      const info = await (await fetch("downloads/"+encodeURIComponent(v)+"/info.json", {cache:"no-store"})).json();
      info.version = v;
      DATA.push(info);
    }catch(e){}
  }
  DATA.sort((a,b)=> b.version.localeCompare(a.version, undefined, {numeric:true}));
  const l = DATA[0];
  if(l){
    document.getElementById("btnSetup").href = dlUrl(l, l.files.setup);
    document.getElementById("meta").innerHTML = "v"+esc(l.version)+" &nbsp; "+fmt(l.files.setup.size);
  }
  const total = DATA.length;
  if(total > LIMIT) document.getElementById("showAllBox").hidden = false;
  document.getElementById("showAllBtn").onclick = ()=>{ shown = total; render(); document.getElementById("showAllBox").hidden = true; };
  render();
}

function render(){
  const rows = DATA.slice(0, shown).map(r=>{
    const latest = r.version===DATA[0].version ? " <b class='green'>(terbaru)</b>" : "";
    const patch = r.patch ? " <span class='muted'>[perbaikan]</span>" : "";
    const files = ["setup","msi"].map(k=>{
      const f = r.files[k]; if(!f) return "";
      return "<tr>"+
        "<td width='32%'><a href='"+dlUrl(r,f)+"'>"+f.file+"</a></td>"+
        "<td width='12%' class='r'>"+fmt(f.size)+"</td>"+
        "<td width='40%' class='hash'>"+esc(f.sha256)+"</td>"+
        "<td width='16%' class='c'><button class='b3d' type='button' data-hash='"+esc(f.sha256)+"'>Salin Hash</button></td>"+
        "</tr>";
    }).join("");
    return "<table class='rel' cellpadding='2'>"+
      "<tr><th colspan='4'>v"+esc(r.version)+latest+patch+
      " &nbsp; <span class='muted'>"+esc(r.date||"")+"</span></th></tr>"+
      "<tr><td colspan='4' class='small muted'>"+esc(r.notes||"")+"</td></tr>"+
      files+
      "</table><br>";
  }).join("");
  document.getElementById("list").innerHTML = rows ||
    "<p class='small'>Belum ada rilis.</p>";
  document.querySelectorAll("button[data-hash]").forEach(b=>{
    b.onclick = ()=>copyText(b.dataset.hash, b);
  });
}

load();
</script>
</body>
</html>
